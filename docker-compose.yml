version: '3.9'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: tej_crm_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: tej_crm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - crm_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: tej_crm_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - crm_network

  # Laravel Backend (PHP-FPM)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tej_crm_backend
    restart: unless-stopped
    environment:
      APP_NAME: "TEJ India CRM"
      APP_ENV: local
      APP_KEY: base64:dGVqaW5kaWFjcm1hcHBrZXlnZW5lcmF0ZTEyMzQ=
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: tej_crm
      DB_USERNAME: postgres
      DB_PASSWORD: secret
      CACHE_DRIVER: redis
      REDIS_HOST: redis
      FRONTEND_URL: http://localhost:3000
      SANCTUM_STATEFUL_DOMAINS: localhost:3000
      SESSION_DOMAIN: localhost
    volumes:
      - backend_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - crm_network
    command: >
      sh -c "
        php artisan migrate --force 2>/dev/null;
        php artisan db:seed --force 2>/dev/null;
        php-fpm
      "

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tej_crm_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost/api
    depends_on:
      - backend
    networks:
      - crm_network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: tej_crm_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - crm_network

volumes:
  postgres_data:
  backend_storage:

networks:
  crm_network:
    driver: bridge
