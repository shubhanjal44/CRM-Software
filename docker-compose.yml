version: '3.9'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: tej_crm_db
    environment:
      POSTGRES_DB: tej_crm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - crm_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: tej_crm_redis
    ports:
      - "6379:6379"
    networks:
      - crm_network

  # Laravel Backend (PHP-FPM)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tej_crm_backend
    environment:
      APP_ENV: production
      APP_KEY: base64:RUN_php_artisan_key_generate
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: tej_crm
      DB_USERNAME: postgres
      DB_PASSWORD: secret
      CACHE_DRIVER: redis
      REDIS_HOST: redis
      SANCTUM_STATEFUL_DOMAINS: localhost:3000
    volumes:
      - ./backend:/var/www/html
      - backend_storage:/var/www/html/storage
    depends_on:
      - db
      - redis
    networks:
      - crm_network

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tej_crm_frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost/api
    depends_on:
      - backend
    networks:
      - crm_network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: tej_crm_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - crm_network

volumes:
  postgres_data:
  backend_storage:

networks:
  crm_network:
    driver: bridge
